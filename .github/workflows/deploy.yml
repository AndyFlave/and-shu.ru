name: Deploy to Sprinthost

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REMOTE_HOST: ${{ vars.REMOTE_HOST }}
      REMOTE_USER: ${{ vars.REMOTE_USER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate static site
        run: yarn generate

      - name: Setup SSH
        run: |
          if [ -z "$REMOTE_HOST" ] || [ -z "$REMOTE_USER" ]; then
            echo "::error::REMOTE_HOST/REMOTE_USER variables не заданы в Settings → Variables."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$REMOTE_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Fetch deploy excludes from server
        run: |
          set -e
          ssh -i ~/.ssh/id_ed25519 "$REMOTE_USER@$REMOTE_HOST" \
            "test -f ~/.deploy-excludes" \
            || { echo "::error::~/.deploy-excludes не найден на сервере. Без него --delete может стереть чужие папки."; exit 1; }
          scp -i ~/.ssh/id_ed25519 \
            "$REMOTE_USER@$REMOTE_HOST:~/.deploy-excludes" \
            ./.deploy-excludes

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            --exclude-from=./.deploy-excludes \
            -e "ssh -i ~/.ssh/id_ed25519" \
            ./.output/public/ \
            "$REMOTE_USER@$REMOTE_HOST:${{ vars.DEPLOY_PATH }}"
